# Builds the server for hosts and attaches it to a GitHub Release.
#
# Push a tag named v<version> (e.g. v1.1.0) to test, build and publish a
# release. Run it by hand from the Actions tab to test and build without
# releasing; the archives are then downloadable from the run's artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite reads Constants.xml and the scripts from the GG2 source, so it
      # needs the same checkout the tests were written against.
      - uses: actions/checkout@v4
        with:
          repository: Gang-Garrison-2/Gang-Garrison-2
          ref: ea8d69511ee1a2f76bc8266bf890764f480c4993
          path: reference

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        env:
          GG2_REFERENCE: ${{ github.workspace }}/reference
        run: dotnet test Gg2.sln -c Release

  build:
    needs: test
    strategy:
      matrix:
        rid: [linux-x64, win-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Self-contained, so a host needs no .NET runtime installed. The output
      # carries the maps, nav graphs and policy checkpoints beside the binary.
      - name: Publish
        run: >
          dotnet publish src/Gg2.Host/Gg2.Host.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o out/gg2-server

      # tar keeps the executable bit a Linux host needs; Windows gets a zip.
      - name: Archive
        run: |
          base="gg2-server-${{ steps.version.outputs.name }}-${{ matrix.rid }}"
          cd out
          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            chmod +x gg2-server/gg2-server
            tar -czf "../$base.tar.gz" gg2-server
          else
            zip -qr "../$base.zip" gg2-server
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: gg2-server-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
