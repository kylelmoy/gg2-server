# Builds the server for hosts and attaches it to a GitHub Release.
#
# Push a tag named v<version> (e.g. v1.1.0) to test, build and publish a
# release. Run it by hand from the Actions tab to test and build without
# releasing; the archives are then downloadable from the run's artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The suite reads Constants.xml and the scripts from the GG2 source, so it
      # needs the same checkout the tests were written against.
      - uses: actions/checkout@v7
        with:
          repository: Gang-Garrison-2/Gang-Garrison-2
          ref: ea8d69511ee1a2f76bc8266bf890764f480c4993
          path: reference

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        env:
          GG2_REFERENCE: ${{ github.workspace }}/reference
        run: dotnet test GG2.sln -c Release

  # The macOS builds run on a macOS runner because only there does the SDK
  # sign the executable. Apple Silicon kills an unsigned binary on launch, and
  # a cross-publish from Linux produces exactly that. The ad-hoc signature is
  # enough for a download that never carries the quarantine flag, which is
  # what install.sh's curl or wget gives. A browser download does carry it.
  build:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            # ${GITHUB_SHA::7} is a syntax error in macOS's bash 3.2.
            echo "name=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # Self-contained, so a host needs no .NET runtime installed. The output
      # carries the maps, nav graphs and policy checkpoints beside the binary.
      - name: Publish
        run: >
          dotnet publish src/GG2.Host/GG2.Host.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o out/gg2-server

      # Starts the binary where the runner can run it natively, so a build that
      # macOS refuses to launch (an unsigned arm64 apphost) fails here rather
      # than on a player's machine.
      - name: Launch check
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        run: out/gg2-server/gg2-server --version

      # tar keeps the executable bit Linux and macOS need; Windows gets a zip.
      # install.sh and install.ps1 build these names from the tag and the RID,
      # so renaming them breaks the quick start for every later release.
      # COPYFILE_DISABLE keeps macOS's tar from adding ._ metadata files.
      - name: Archive
        run: |
          base="gg2-server-${{ steps.version.outputs.name }}-${{ matrix.rid }}"
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -qr "../$base.zip" gg2-server
          else
            chmod +x gg2-server/gg2-server
            COPYFILE_DISABLE=1 tar -czf "../$base.tar.gz" gg2-server
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: gg2-server-*
          if-no-files-found: error

  # The container image, from the Dockerfile at the root. A tag pushes it to
  # GHCR as :<version> and :latest; a manual run builds it without pushing.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # Build into the local daemon first and start it, so an image that
      # builds but does not serve never reaches :latest. No --lobby, so the
      # run is never listed publicly.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gg2-server:smoke
          build-args: VERSION=0.0.0-dev

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8190:8190 -p 8191:8191 gg2-server:smoke --bots 2
          for i in $(seq 30); do
            if docker logs smoke 2>&1 | grep -q 'web admin password'; then break; fi
            sleep 1
          done
          docker logs smoke
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          timeout 5 bash -c '</dev/tcp/127.0.0.1/8190'
          curl -sf -o /dev/null http://127.0.0.1:8191/
          docker stop smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only a tag's version is valid semver; an untagged run's is
          # sha-<hash>, which fails NuGet restore without logging an error.
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0-dev' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the four archives: the docker job uploads .dockerbuild records to the
      # same run, and downloading those fails the step.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{linux,win,osx}-*'
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
